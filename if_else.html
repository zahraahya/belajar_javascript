<body>
    <script>
        let nilai=90;

        if(nilai>=90) {
            document.write ("IPK = 4");
        } else if (nilai >=85)
        {document.write ("IPK = 3,7");}
        else if (nilai <85 && nilai >=80) {
            document.write ("IPK = 3,5");
        } else {document.write ("IPK = 3");}

    </script>
